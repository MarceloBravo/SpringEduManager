<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>

    <!-- Toast generado por Thymeleaf -->
    <div th:fragment="toast" class="toast-container position-absolute top-0 end-0 p-3">

        <div 
            th:if="${message != null and not #strings.isEmpty(message)}" 
            id="feedback-toast" 
            class="toast toast-success"
            th:classappend="${code == 200} ? 'toast-success' : (${code == 400} ? 'toast-danger' : (${code == 500} ? 'toast-danger' : 'toast-info'))"
            role="alert" 
            aria-live="assertive" 
            aria-atomic="true"
        >
            <div class="toast-header">
                <strong 
                    class="me-auto"
                    th:text="${code == 200} ? 'Operación exitosa' : (${code == 400} ? 'Operación fallida' : (${code == 500} ? 'Error interno del servidor' : 'Información'))">
                    Título del toast
                </strong>
                <!-- <small class="text-muted">just now</small> -->
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" th:text="${message}">
                Mensaje del toast
            </div>
        </div>

        <!-- Toast generado por JavaScript -->
        <div class="toast bg-primary toast-js" id="toast-js" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-header">
                <strong class="me-auto" id="toast-js-title">Bootstrap</strong>
                <button type="button" class="btn-close" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
            <div class="toast-body" id="toast-js-body">
                Atención, los toasts se apilarán automáticamente
            </div>
        </div>
    </div>
