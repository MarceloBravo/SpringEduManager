<!DOCTYPE html>

<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Spring EduManagement</title>
    <!-- Tailwind CSS with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Manrope & Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
    <link rel="stylesheet" href="/css/cursos-list.css" type="text/css" />
    <link rel="stylesheet" href="/css/sidebar.css" type="text/css" />
    <link rel="stylesheet" href="/css/modal.css" type="text/css" />
    <link rel="stylesheet" href="/css/toast.css" type="text/css" />
    <link rel="stylesheet" href="/css/global.css" type="text/css" />

    <script src="/js/modal.js"></script>
    <script src="/js/toast.js"></script>
    <script id="tailwind-config" src="/js/cursos-list.js"></script>
    <script src="/js/tailwind.js"></script>
</head>

<body class="bg-surface text-on-surface min-h-screen">
    <!-- Barra de Menú lateral -->
    <div th:replace="~{../fragments/toast :: toast}"></div>
    <div th:replace="~{../fragments/modal :: modal}"></div>
    <div th:replace="~{../fragments/sidebar :: sidebar}"></div>
    
    <!-- Contenido Principal -->
    <main class="ml-64 p-8">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold mb-6">Lista de Cursos</h1>
            
            <div class="my-breadcrumb">
                <a href="/home">Inicio</a>
                <span>/</span>
                <span>Lista de Cursos</span>
            </div>

            <div class="mb-6 top-tool-bar">
                <a href="/cursos/new" class="bg-blue-500">
                    <span class="material-symbols-outlined inline-block align-middle mr-1">add</span>
                    Agregar Curso
                </a>
                <form action="/cursos/list" method="get" class="form-search">
                    <div class="form-group mx-sm-3 mb-2">
                        <label for="input-search" class="sr-only">Buscar por:</label>
                        <input type="text" class="form-control" id="input-search" name="filtro" th:value="${filtro}" placeholder="Valor buscado">
                        <button type="submit" class="btn btn-primary mb-2">Buscar</button>
                    </div>
                </form>
            </div>
            <!-- Tabla de Cursos -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="border-b">
                                <th class="px-4 py-2 text-left">
                                    <a th:href="
                                        @{/cursos/list(
                                            page=${page > 0 ? page - 1 : 0}, 
                                            size=${pageSize}, 
                                            sortBy='nombre', 
                                            dir=${sortField == 'nombre' and sortDir == 'asc' ? 'desc' : 'asc'}
                                        )}
                                    ">
                                        Nombre
                                    </a>
                                </th>
                                <th class="px-4 py-2 text-left">
                                    <a th:href="
                                        @{/cursos/list(
                                            page=${page > 0 ? page - 1 : 0}, 
                                            size=${pageSize}, 
                                            sortBy='descripcion', 
                                            dir=${sortField == 'descripcion' and sortDir == 'asc' ? 'desc' : 'asc'}
                                        )}
                                    ">
                                        Descripción
                                    </a>
                                </th>
                                
                                <th class="px-4 py-2 text-left col-actions">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="curso : ${cursos}" class="border-b hover:bg-gray-50">
                                <td class="px-4 py-2" th:text="${curso.nombre}"></td>
                                <td class="px-4 py-2" th:text="${curso.descripcion}"></td>
                                <td class="px-4 py-2 col-actions">
                                    <a th:href="@{/cursos/{id}(id=${curso.id})}" class="bg-red-500 hover:bg-red-700 text-white px-3 py-1 rounded ml-2">
                                        <i class="material-symbols-outlined">edit</i>
                                    </a>
                                    <button 
                                        class="bg-blue-500 hover:bg-blue-700 text-white px-3 py-1 rounded"
                                        th:onclick="'eliminarCursoClick(' + ${curso.id} + ')'"
                                    >
                                        <i class="material-symbols-outlined">delete</i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <div class="row">
                    <div class="col-6 text-left">
                        <div th:replace="~{../fragments/pagination :: pagination}"></div>
                    </div>
                    <div class="col-6">
                        <div class="mt-4 text-sm text-gray-600 text-right">
                            Página <span th:text="${page + 1}">1</span> de <span th:text="${totalPages}">1</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <form 
        method="post" 
        th:action="@{/cursos/delete}"
        id="deleteForm"
        style="display: none;">
        <input type="hidden" name="id" id="delete-id" value="" />
    </form>
</body>

</html>
