<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" 
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security6">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Spring EduManagement</title>
    <!-- Tailwind CSS with plugins -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts: Manrope & Inter -->
    <link
        href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet" />
    <!-- Material Symbols -->
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">

    <link rel="stylesheet" href="/css/sidebar.css" type="text/css" />
    <link rel="stylesheet" href="/css/toast.css" type="text/css" />
    <link rel="stylesheet" href="/css/dashboard.css" type="text/css" />
    
    <script src="/js/tailwind.js"></script>
    <script src="/js/toast.js"></script>
    <script id="tailwind-config" src="/js/tailwind.js"></script>
</head>
<body class="bg-surface text-on-surface min-h-screen">

    <div th:replace="~{../fragments/toast :: toast}"></div>
    <div th:replace="~{../fragments/sidebar :: sidebar}"></div>

    <!-- Contenido Principal -->
    <main class="ml-64 p-8">
        <div class="container mx-auto">
            <div class="row">
                <h1 class="text-3xl font-bold mb-6">SpringEduManager</h1>
                <h2 th:if="${#authorization.expression('hasRole(''ADMIN'')')}" class="text-lg font-semibold mb-4">Portal de administración</h2>
                <h2 th:if="${#authorization.expression('hasRole(''STUDENT'')')}" class="text-lg font-semibold mb-4">Portal del estudiante</h2>
            </div>
            <h1 class="text-5xl font-bold mb-6 welcome-title">Bienvenido</h1>
        </div>
    </main>
</body>
</html>
