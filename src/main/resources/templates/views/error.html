<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Error | SpringEduManager</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap"
        rel="stylesheet" />
    <link href="/css/error.css" rel="stylesheet" />
</head>
<body>
    <div class="error-container">
        <span class="material-symbols-outlined error-icon" data-icon="error" 
              style="font-variation-settings: 'FILL' 1;">error</span>
        
        <h1 class="error-title">Ha ocurrido un error</h1>
        
        <p class="error-message">
            Lo sentimos, ha ocurrido un error inesperado. Por favor, inténtalo de nuevo más tarde.
        </p>
        
        <div th:if="${error}" class="error-details">
            <span class="material-symbols-outlined" data-icon="error_outline" 
                  style="font-size: 1.2rem; vertical-align: middle; margin-right: 0.5rem;">error_outline</span>
            <span th:text="${error}">Mensaje de error específico</span>
        </div>
        
        <div class="action-buttons">
            <button onclick="history.back()" class="btn btn-primary">
                <span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
                Volver
            </button>
            
            <a href="/login" class="btn btn-secondary">
                <span class="material-symbols-outlined" data-icon="login">login</span>
                Ir al inicio de sesión
            </a>
        </div>
        
        <div class="footer">
            SpringEduManager - Sistema de Gestión Educativa
        </div>
    </div>
</body>
</html>
