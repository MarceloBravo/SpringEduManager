<!DOCTYPE html>
<html class="light" lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Spring EduManagement - Usuarios (Paginado)</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <!-- Material Symbols -->
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.0.0/dist/css/bootstrap.min.css" integrity="sha384-Gn5384xqQ1aoWXA+058RXPxPg6fy4IWvTNh0E263XmFcJlSAwiGgFAW/dAiS6JXm" crossorigin="anonymous">
    
    <link rel="stylesheet" href="/css/usuarios-list.css" type="text/css" />
    <link rel="stylesheet" href="/css/sidebar.css" type="text/css" />
    <link rel="stylesheet" href="/css/modal.css" type="text/css" />
    <link rel="stylesheet" href="/css/toast.css" type="text/css" />
    
    <script src="/js/modal.js"></script>
    <script src="/js/toast.js"></script>
    <script src="/js/tailwind.js"></script>
</head>

<body class="bg-surface text-on-surface min-h-screen">
    <!-- Barra de Menú lateral -->
    <div th:replace="~{../fragments/toast :: toast}"></div>
    <div th:replace="~{../fragments/modal :: modal}"></div>
    <div th:replace="~{../fragments/sidebar :: sidebar}"></div>
    
    <!-- Contenido Principal -->
    <main class="ml-64 p-8">
        <div class="container mx-auto">
            <h1 class="text-3xl font-bold mb-6">Lista de Usuarios (Paginado)</h1>
            
            <!-- Controles de paginación -->
            <div class="mb-6 bg-gray-100 p-4 rounded-lg">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <!-- Búsqueda -->
                    <div class="flex items-center gap-2">
                        <form th:action="@{/users-paged/search}" method="get" class="flex gap-2">
                            <input type="text" name="nombre" th:value="${searchTerm}" 
                                   placeholder="Buscar por nombre..." 
                                   class="px-3 py-2 border rounded-lg">
                            <button type="submit" class="bg-blue-500 text-white px-4 py-2 rounded-lg hover:bg-blue-600">
                                <span class="material-symbols-outlined align-middle">search</span>
                                Buscar
                            </button>
                        </form>
                    </div>
                    
                    <!-- Controles de página -->
                    <div class="flex items-center gap-4">
                        <!-- Tamaño de página -->
                        <div class="flex items-center gap-2">
                            <label class="text-sm font-medium">Mostrar:</label>
                            <select onchange="changePageSize(this.value)" class="px-2 py-1 border rounded">
                                <option th:selected="${pageSize == 5}" value="5">5</option>
                                <option th:selected="${pageSize == 10}" value="10">10</option>
                                <option th:selected="${pageSize == 20}" value="20">20</option>
                                <option th:selected="${pageSize == 50}" value="50">50</option>
                            </select>
                        </div>
                        
                        <!-- Ordenamiento -->
                        <div class="flex items-center gap-2">
                            <label class="text-sm font-medium">Ordenar por:</label>
                            <a th:href="@{/users-paged/list(page=0, size=${pageSize}, sort='nombre', dir=${sortField == 'nombre' and sortDir == 'asc' ? 'desc' : 'asc'})}" 
                               class="px-2 py-1 border rounded hover:bg-gray-200">
                                Nombre <span th:if="${sortField == 'nombre'}" 
                                          th:text="${sortDir == 'asc' ? 'up' : 'down'}"></span>
                            </a>
                            <a th:href="@{/users-paged/list(page=0, size=${pageSize}, sort='apellido', dir=${sortField == 'apellido' and sortDir == 'asc' ? 'desc' : 'asc'})}" 
                               class="px-2 py-1 border rounded hover:bg-gray-200">
                                Apellido <span th:if="${sortField == 'apellido'}" 
                                           th:text="${sortDir == 'asc' ? 'up' : 'down'}"></span>
                            </a>
                            <a th:href="@{/users-paged/list(page=0, size=${pageSize}, sort='email', dir=${sortField == 'email' and sortDir == 'asc' ? 'desc' : 'asc'})}" 
                               class="px-2 py-1 border rounded hover:bg-gray-200">
                                Email <span th:if="${sortField == 'email'}" 
                                         th:text="${sortDir == 'asc' ? 'up' : 'down'}"></span>
                            </a>
                        </div>
                    </div>
                </div>
                
                <!-- Información de paginación -->
                <div class="mt-4 text-sm text-gray-600">
                    Mostrando <span th:text="${users.size()}">0</span> de 
                    <span th:text="${totalItems}">0</span> usuarios 
                    (Página <span th:text="${currentPage + 1}">1</span> de <span th:text="${totalPages}">1</span>)
                </div>
            </div>
            
            <!-- Tabla de usuarios -->
            <div class="bg-white rounded-lg shadow-md p-6">
                <div class="overflow-x-auto">
                    <table class="min-w-full table-auto">
                        <thead>
                            <tr class="border-b">
                                <th class="px-4 py-2 text-left">ID</th>
                                <th class="px-4 py-2 text-left">Nombre</th>
                                <th class="px-4 py-2 text-left">Apellido</th>
                                <th class="px-4 py-2 text-left">Email</th>
                                <th class="px-4 py-2 text-left">Rol</th>
                                <th class="px-4 py-2 text-left col-actions">Acciones</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="user : ${users}" class="border-b hover:bg-gray-50">
                                <td class="px-4 py-2" th:text="${user.id}">1</td>
                                <td class="px-4 py-2" th:text="${user.nombre}">Juan</td>
                                <td class="px-4 py-2" th:text="${user.apellido}">Pérez</td>
                                <td class="px-4 py-2" th:text="${user.email}">juan@example.com</td>
                                <td class="px-4 py-2" th:text="${user.role}">USER</td>
                                <td class="px-4 py-2 col-actions">
                                    <a th:href="@{/users/{id}(id=${user.id})}" 
                                       class="bg-red-500 hover:bg-red-700 text-white px-3 py-1 rounded ml-2">
                                        <i class="material-symbols-outlined">edit</i>
                                    </a>
                                    <button class="bg-blue-500 hover:bg-blue-700 text-white px-3 py-1 rounded">
                                        <i class="material-symbols-outlined">delete</i>
                                    </button>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                    
                    <!-- Mensaje si no hay resultados -->
                    <div th:if="${users.empty}" class="text-center py-8 text-gray-500">
                        No se encontraron usuarios.
                    </div>
                </div>
            </div>
            
            <!-- Controles de navegación de páginas -->
            <div th:if="${totalPages > 1}" class="mt-6 flex justify-center">
                <nav class="flex items-center space-x-2">
                    <!-- Primera página -->
                    <a th:href="@{/users-paged/list(page=0, size=${pageSize}, sort=${sortField}, dir=${sortDir})}" 
                       th:classappend="${currentPage == 0} ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-200'"
                       class="px-3 py-2 border rounded">
                        <span class="material-symbols-outlined">first_page</span>
                    </a>
                    
                    <!-- Página anterior -->
                    <a th:href="@{/users-paged/list(page=${currentPage - 1}, size=${pageSize}, sort=${sortField}, dir=${sortDir})}" 
                       th:if="${currentPage > 0}"
                       class="px-3 py-2 border rounded hover:bg-gray-200">
                        <span class="material-symbols-outlined">chevron_left</span>
                    </a>
                    
                    <!-- Números de página -->
                    <div th:each="i : ${#numbers.sequence(0, totalPages - 1)}">
                        <a th:href="@{/users-paged/list(page=${i}, size=${pageSize}, sort=${sortField}, dir=${sortDir})}" 
                           th:classappend="${i == currentPage} ? 'bg-blue-500 text-white' : 'hover:bg-gray-200'"
                           class="px-3 py-2 border rounded"
                           th:text="${i + 1}">1</a>
                    </div>
                    
                    <!-- Página siguiente -->
                    <a th:href="@{/users-paged/list(page=${currentPage + 1}, size=${pageSize}, sort=${sortField}, dir=${sortDir})}" 
                       th:if="${currentPage < totalPages - 1}"
                       class="px-3 py-2 border rounded hover:bg-gray-200">
                        <span class="material-symbols-outlined">chevron_right</span>
                    </a>
                    
                    <!-- Última página -->
                    <a th:href="@{/users-paged/list(page=${totalPages - 1}, size=${pageSize}, sort=${sortField}, dir=${sortDir})}" 
                       th:classappend="${currentPage == totalPages - 1} ? 'opacity-50 cursor-not-allowed' : 'hover:bg-gray-200'"
                       class="px-3 py-2 border rounded">
                        <span class="material-symbols-outlined">last_page</span>
                    </a>
                </nav>
            </div>
        </div>
    </main>
    
    <script>
        function changePageSize(size) {
            const url = new URL(window.location);
            url.searchParams.set('size', size);
            url.searchParams.set('page', '0');
            window.location.href = url.toString();
        }
    </script>
</body>
</html>
